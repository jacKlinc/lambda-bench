[project]
name = "lambda-bench"
version = "0.1.0"
description = "AWS Lambda cold/warm start benchmarking tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.22",
    "coverage>=7.14.1",
    "matplotlib>=3.10.9",
    "pytest-cov>=7.1.0",
    "typer>=0.26.7",
]

[project.scripts]
lambda-bench = "lambdabench.cli:app"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambdabench"]

[tool.pytest.ini_options]
markers = [
    "integration: calls real AWS Lambda — set LAMBDA_BENCH_INTEGRATION=1 to run",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
