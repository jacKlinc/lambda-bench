[project]
name = "lambda-bench"
version = "0.2.0"
description = "AWS Lambda cold/warm start benchmarking tool"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Jack Harding", email = "jackharding321@gmail.com" }]
requires-python = ">=3.14"
keywords = ["aws", "lambda", "benchmark", "performance", "cold-start"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "boto3>=1.43.22",
    "matplotlib>=3.10.9",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/jacKlinc/lambda-bench"
Repository = "https://github.com/jacKlinc/lambda-bench"
Issues = "https://github.com/jacKlinc/lambda-bench/issues"

[project.scripts]
lambda-bench = "lambdabench.cli:app"

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "hatchling>=1.30.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambdabench"]

[tool.pytest.ini_options]
markers = [
    "integration: calls real AWS Lambda — set LAMBDA_BENCH_INTEGRATION=1 to run",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
